# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: pinky
description: ALL PINKKKKK.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # pin to e.g. 42 if you want predictable rebuilds

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    group-install:
      packages:
        - kde-desktop-environment
    install:
      packages:
        - micro
        - neovim
        - starship
        - hyprland
        - waybar
        - wofi
        - kitty
        - hyprpaper
        - xdg-desktop-portal-hyprland
        - adw-gtk3-theme
        - papirus-icon-theme
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: gschema-overrides
    include:
      - zz1-pinky.gschema.override

  - type: systemd
    system:
      enabled:
        - gdm

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.vinegarhq.Sober
          - com.visualstudio.code

  - type: signing # keep last
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
